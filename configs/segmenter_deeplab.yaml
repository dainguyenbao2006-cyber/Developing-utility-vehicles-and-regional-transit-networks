model:
  architecture: "DeepLabV3Plus"
  encoder: "resnet34"
  encoder_weights: "imagenet"
  input_size_hw: [384, 640]
  num_classes: 3
  thresholds: [0.5, 0.5, 0.4]

train:
  epochs: 30
  batch_size: 8
  lr: 0.0003
  weight_decay: 0.0001
  loss: "bce_dice"
  bce_weight: 0.5
  dice_weight: 0.5
  channel_weights: [1.0, 1.0, 1.5]
  amp: true
  num_workers: 4
