[project]
name = "developing-utility-vehicles-and-regional-transit-networks"
version = "0.1.0"
description = "ADAS-Vision: Traffic object detection (YOLO11), lane/drivable segmentation (DeepLabV3+), and rule-based ADAS logic on BDD100K/Cityscapes."
readme = "README.md"
authors = [
    { name = "dainguyenbao2006-cyber", email = "dainguyenbao2006@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "albumentations>=2.0.8",
    "cityscapesscripts>=2.3.0",
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
    "scikit-learn>=1.9.1",
    "segmentation-models-pytorch>=0.6.0",
    "streamlit>=1.66.1",
    "tensorboard>=2.21.0",
    "tqdm>=4.70.1",
    "ultralytics>=8.4.202",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"

